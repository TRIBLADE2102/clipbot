name: live
on:
  schedule: [{cron: "*/5 * * * *"}]   # check every 5 min (GitHub may delay a few min)
  workflow_dispatch:
concurrency: {group: live, cancel-in-progress: false}
permissions: {contents: read}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # GitHub max is 6h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: whisper-base-en}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core && pip install -q -r requirements.txt
      - name: Run
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
        run: |
          printf '%s' "$YT_TOKEN" > token.json
          python -u watch.py
