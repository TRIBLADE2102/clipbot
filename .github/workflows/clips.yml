name: clips
on:
  schedule: [{cron: "0 */3 * * *"}]   # every 3 hours (UTC clock, same spacing)
  workflow_dispatch:
concurrency: {group: clips, cancel-in-progress: false}
permissions: {contents: write}        # to save posted.json back
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: whisper-base-en}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core && pip install -q -r requirements.txt
      - name: Run
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
        run: |
          printf '%s' "$YT_TOKEN" > token.json
          python -u clipbot.py ${{ github.event_name == 'workflow_dispatch' && '--dry-run' || '' }}
      - name: Save posted list
        if: always()
        run: |
          git config user.name clipbot && git config user.email clipbot@users.noreply.github.com
          git add posted.json 2>/dev/null && git commit -qm "posted clips" && git pull -q --rebase && git push -q || true
